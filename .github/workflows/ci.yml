name: BARQ CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: ci-test-password
      PUBLIC_PORT: 8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create application environment
        run: |
          mkdir -p config
          cat > config/app.env <<EOF
          DATABASE_URL=postgresql://barq_app:${POSTGRES_PASSWORD}@postgres:5432/barq_tasks
          REDIS_URL=redis://redis:6379/0
          EOF

      - name: Python syntax check
        run: |
          python -m py_compile validate.py failure_test.py

      - name: Compose config check
        run: docker compose config

      - name: Build application
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ready; then
              echo
              echo "Ready"
              exit 0
            fi
            sleep 2
          done
          echo "Readiness timeout"
          docker compose ps
          docker compose logs
          exit 1

      - name: Run validation
        run: python3 validate.py

      - name: Cleanup
        if: always()
        run: docker compose down -v
